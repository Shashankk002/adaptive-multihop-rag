[project]
name = "amrag"
version = "0.0.0"
description = "Adaptive Multi-Hop RAG with Evidence Verification — an adaptive multi-hop retrieval pipeline that verifies evidence sufficiency and selectively expands retrieved evidence before answer generation."
requires-python = ">=3.12,<3.13"

# Unpinned on purpose; the set the reported results were produced with is recorded in
# README.md (Setup).
dependencies = [
    "sentence-transformers",  # dense embeddings (and the rejected cross-encoder)
    "numpy",                  # similarity maths and the embedding cache
    "google-genai",           # Gemini verifier and generator
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# "src" lets the suite run before the package is installed; "." makes the shared test
# fakes (`tests.test_dense.fake_encode`) importable under a bare `pytest` too.
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
